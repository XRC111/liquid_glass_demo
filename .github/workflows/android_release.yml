name: Android CI & Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze:
    name: Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.35.7
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  build-release:
    name: Build release APK
    needs: analyze
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.35.7
          cache: true
      - run: flutter pub get
      - run: flutter build apk --release
      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk liquid-glass-demo-${GITHUB_REF_NAME}.apk
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: liquid-glass-demo-*.apk
          generate_release_notes: true
          body: |
            Liquid Glass Demo release APK (Android API 24-35).

            Install: download the APK and sideload it. The app auto-detects
            the device capability and picks the right quality tier
            (full / medium / minimal).
